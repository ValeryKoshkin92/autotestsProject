plugins {
    id 'java'
    id 'io.qameta.allure' version '4.1.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '26'
    targetCompatibility = '26'
    toolchain {
        languageVersion = JavaLanguageVersion.of(26) // или 21, 17, 11
    }
}

repositories {
    mavenCentral()
}

ext['seleniumVersion'] = System.getProperty('selenium.version', '4.47.0')

allure {
    version.set('2.20.1')
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"
    testImplementation "org.seleniumhq.selenium:selenium-grid:${seleniumVersion}"
    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.titusfortner:selenium-logger:2.4.0'
    testImplementation("io.github.bonigarcia:webdrivermanager:6.3.4")

    // Allure зависимости - только основные
    testImplementation "io.qameta.allure:allure-junit5:2.35.2"
}

test {
    useJUnitPlatform()
    systemProperty "allure.results.directory", "build/allure-results"
}