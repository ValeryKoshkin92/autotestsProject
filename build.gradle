plugins {
    id 'java'
    id 'io.qameta.allure' version '4.1.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '26'
    targetCompatibility = '26'
    toolchain {
        languageVersion = JavaLanguageVersion.of(26) // или 21, 17, 11
    }
}

repositories {
    mavenCentral()
}

ext['seleniumVersion'] = System.getProperty('selenium.version', '4.47.0')

allure {
    version.set('2.20.1')
}

dependencies {
    implementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"
    implementation "org.seleniumhq.selenium:selenium-grid:${seleniumVersion}"
    implementation platform("org.junit:junit-bom:6.1.3")
    implementation 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.titusfortner:selenium-logger:2.4.0'
    implementation("io.github.bonigarcia:webdrivermanager:6.3.4")
    implementation 'io.rest-assured:rest-assured:6.0.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'io.qameta.allure:allure-rest-assured:2.29.0'
    implementation("org.aspectj:aspectjweaver:1.9.25.1")

    // Allure зависимости - только основные
    implementation "io.qameta.allure:allure-junit5:2.35.2"
}

test {
    useJUnitPlatform()
    systemProperty "allure.results.directory", "build/allure-results"
}